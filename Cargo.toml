[package]
name = "async-geotiff"
version = "0.0.2"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Async COG → XYZ tile renderer (pure Rust, no GDAL)"

[dependencies]
async-tiff        = "0.3"
async-trait       = "0.1"
object_store      = { version = "0.13", features = ["http", "aws"] }
tile-grid         = "0.6"
proj              = { version = "0.31", optional = true }
raffine           = "0.2"
ndarray           = { version = "0.17", features = ["rayon"] }
fast_image_resize = { version = "6", features = ["rayon"] }
palette           = "0.7"
colorous          = "1"
enterpolation     = "0.3"
image             = { version = "0.25", default-features = false, features = ["png"] }
bytes             = "1"
bytemuck          = "1"
nom               = "8"
bitflags          = "2"
moka              = { version = "0.12", features = ["future"] }
tokio             = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
rayon             = "1"
thiserror         = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
serde_urlencoded  = "0.7"
tracing           = "0.1"
url               = "2"
quick-xml         = "0.39"
stac-client       = { version = "0.3", optional = true }
futures = { version = "0.3.32", optional = true }

[dev-dependencies]
tokio             = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "fs", "io-util"] }
criterion         = "0.8"
tempfile          = "3"
approx            = "0.5"
serde_json        = "1"
# HTTP layer lives only in examples/serve.rs, not the library core.
axum              = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
moka              = { version = "0.12", features = ["future"] }

[features]
default = ["proj", "mosaic"]
proj    = ["dep:proj"]
webp    = ["image/webp"]
jpeg    = ["image/jpeg"]
mosaic  = ["dep:futures"]
stac    = ["mosaic", "dep:stac-client"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[[example]]
name = "serve"
required-features = ["mosaic"]

[[example]]
name = "mosaic_source"
required-features = ["mosaic"]

[[example]]
name = "mosaic_json"
required-features = ["mosaic"]

[[bench]]
name = "resampler_bench"
harness = false
