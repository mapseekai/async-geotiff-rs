name: Deploy documentation to Cloudflare Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.165.0
  GOWORK: off
  HUGO_MODULE_WORKSPACE: off
  HUGO_CACHEDIR: ${{ github.workspace }}/website/.hugo_cache
  CLOUDFLARE_ACCOUNT_ID: bdebb92ffabb18388b7e2e864d63aee7
  CLOUDFLARE_PROJECT_NAME: async-geotiff-rs
  CLOUDFLARE_PAGES_URL: https://async-geotiff-rs.pages.dev/

jobs:
  deploy:
    name: Build and deploy documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: website/go.mod
          cache-dependency-path: website/go.sum

      - name: Install Hugo Extended
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"

      - name: Download OINK
        run: go mod download github.com/pgsty/oink

      - name: Build production site
        run: |
          hugo --cleanDestinationDir --gc --minify --environment production \
            --printPathWarnings --panicOnWarning \
            --baseURL "${CLOUDFLARE_PAGES_URL}"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN GitHub Secret is required for deployment." >&2
            exit 1
          fi
          npx wrangler@4 pages deploy public \
            --project-name="${CLOUDFLARE_PROJECT_NAME}" \
            --branch=main
