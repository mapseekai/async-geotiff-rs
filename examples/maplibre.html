<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>async-geotiff MapLibre example</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <style>
      html,
      body,
      #map {
        height: 100%;
      }

      body {
        margin: 0;
        color: #17202a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #map {
        background: #d8dee6;
      }

      .toolbar {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(5, minmax(92px, auto));
        gap: 8px;
        align-items: end;
        max-width: calc(100vw - 96px);
        padding: 10px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(23, 32, 42, 0.14);
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(23, 32, 42, 0.16);
        backdrop-filter: blur(12px);
      }

      .field {
        display: grid;
        gap: 4px;
        min-width: 92px;
      }

      .field.wide {
        min-width: 138px;
      }

      label {
        color: #4a5568;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0;
        line-height: 1.1;
      }

      input,
      select,
      button {
        box-sizing: border-box;
        height: 32px;
        min-width: 0;
        border: 1px solid #aeb7c2;
        border-radius: 6px;
        background: #ffffff;
        color: #17202a;
        font: inherit;
        font-size: 13px;
      }

      input,
      select {
        padding: 0 8px;
      }

      input[type="range"] {
        padding: 0;
      }

      button {
        padding: 0 12px;
        background: #1f6feb;
        border-color: #1f6feb;
        color: #ffffff;
        cursor: pointer;
        font-weight: 650;
      }

      button:hover {
        background: #1759c8;
      }

      .status {
        position: absolute;
        left: 12px;
        bottom: 22px;
        z-index: 1;
        max-width: min(520px, calc(100vw - 24px));
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 6px 8px;
        border-radius: 6px;
        background: rgba(23, 32, 42, 0.82);
        color: #ffffff;
        font-size: 12px;
      }

      @media (max-width: 760px) {
        .toolbar {
          right: 12px;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          max-width: none;
        }

        .field,
        .field.wide {
          min-width: 0;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <form class="toolbar" id="style-form">
      <div class="field wide">
        <label for="dataset">Dataset</label>
        <select id="dataset" name="dataset"></select>
      </div>
      <div class="field">
        <label for="mode">Source</label>
        <select id="mode" name="mode">
          <option value="single">single dataset</option>
          <option value="mosaic">mosaic</option>
        </select>
      </div>
      <div class="field">
        <label for="pixel_selection">Pixel sel</label>
        <select id="pixel_selection" name="pixel_selection">
          <option value="first">first</option>
          <option value="highest">highest</option>
          <option value="lowest">lowest</option>
          <option value="mean">mean</option>
          <option value="median">median</option>
        </select>
      </div>
      <div class="field">
        <label for="colormap">Colormap</label>
        <select id="colormap" name="colormap_name">
          <option value="">greys</option>
          <option value="viridis">viridis</option>
          <option value="magma">magma</option>
          <option value="inferno">inferno</option>
          <option value="plasma">plasma</option>
          <option value="cividis">cividis</option>
          <option value="turbo">turbo</option>
        </select>
      </div>
      <div class="field">
        <label for="stretch">Stretch</label>
        <select id="stretch" name="stretch">
          <option value="auto">auto (stddev 2σ)</option>
          <option value="custom">custom (rescale)</option>
          <option value="minmax">min/max</option>
          <option value="percent">percentile</option>
          <option value="stddev">mean ± kσ</option>
        </select>
      </div>
      <div class="field">
        <label for="stretchArg" id="stretchArgLabel">pc / σ</label>
        <input id="stretchArg" type="text" autocomplete="off" spellcheck="false"
               placeholder="2,98 or 2.5">
      </div>
      <div class="field wide">
        <label for="rescale">Rescale</label>
        <input id="rescale" name="rescale" type="text" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="bidx">Bands</label>
        <input id="bidx" name="bidx" type="text" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="resampling">Kernel</label>
        <select id="resampling" name="resampling">
          <option value="nearest">nearest</option>
          <option value="bilinear">bilinear</option>
          <option value="average">average</option>
        </select>
      </div>
      <div class="field">
        <label for="tilesize">Tile size</label>
        <select id="tilesize" name="tilesize">
          <option value="64">64</option>
          <option value="128">128</option>
          <option value="256">256</option>
          <option value="512">512</option>
          <option value="1024">1024</option>
        </select>
      </div>
      <div class="field">
        <label for="opacity">Opacity</label>
        <input id="opacity" name="opacity" type="range" min="0" max="1" step="0.05">
      </div>
      <button type="submit">Apply</button>
      <span style="margin-left:auto;font-size:12px">
        viewer:
        <a href="/maplibre" style="color:#2563eb;margin-left:8px">MapLibre</a>
        <a href="/openlayers" style="color:#2563eb;margin-left:8px">OpenLayers</a>
        <a href="/leaflet" style="color:#2563eb;margin-left:8px">Leaflet</a>
      </span>
    </form>
    <div class="status" id="status"></div>

    <script>
      const DEFAULT_TILE_ORIGIN = "http://127.0.0.1:8080";
      const TILE_PATH = "/tiles/WebMercatorQuad/{z}/{x}/{y}.png";
      const MOSAIC_PATH = "/mosaic/tiles/WebMercatorQuad/{z}/{x}/{y}.png";

      function isMosaic() {
        return controls.mode && controls.mode.value === "mosaic";
      }

      function tilePath() {
        return isMosaic() ? MOSAIC_PATH : TILE_PATH;
      }
      const SERVER_DEFAULT_CENTER = "__ASYNC_GEOTIFF_DEFAULT_CENTER__";
      const SERVER_DEFAULT_ZOOM = "__ASYNC_GEOTIFF_DEFAULT_ZOOM__";
      const pageParams = new URLSearchParams(window.location.search);

      const controls = {
        dataset: document.getElementById("dataset"),
        mode: document.getElementById("mode"),
        pixelSelection: document.getElementById("pixel_selection"),
        colormap: document.getElementById("colormap"),
        stretch: document.getElementById("stretch"),
        stretchArg: document.getElementById("stretchArg"),
        rescale: document.getElementById("rescale"),
        bidx: document.getElementById("bidx"),
        resampling: document.getElementById("resampling"),
        tilesize: document.getElementById("tilesize"),
        opacity: document.getElementById("opacity"),
        status: document.getElementById("status")
      };

      controls.mode.value = pageParams.get("mode") ?? "single";
      controls.pixelSelection.value = pageParams.get("pixel_selection") ?? "first";
      controls.colormap.value = pageParams.get("colormap_name") ?? "";
      controls.stretch.value =
        pageParams.get("stretch") ??
        (pageParams.getAll("rescale").length ? "custom" : "auto");
      controls.stretchArg.value =
        pageParams.get("pc") ?? pageParams.get("sigma") ?? "";
      controls.rescale.value = pageParams.getAll("rescale").join(";") || "0,255;0,255;0,255";
      controls.bidx.value = pageParams.getAll("bidx").join(",") || "1,2,3";
      controls.resampling.value = pageParams.get("resampling") ?? "bilinear";
      controls.tilesize.value = pageParams.get("tilesize") ?? "256";
      controls.opacity.value = pageParams.get("opacity") ?? "0.85";

      function tileOrigin() {
        const configured = pageParams.get("tile_origin");
        if (configured) {
          return configured.replace(/\/$/, "");
        }
        if (window.location.protocol === "http:" || window.location.protocol === "https:") {
          return window.location.origin;
        }
        return DEFAULT_TILE_ORIGIN;
      }

      function parseCenter() {
        const raw = pageParams.get("center");
        if (raw) {
          const parts = raw.split(",").map((value) => Number(value.trim()));
          return parts.length === 2 && parts.every(Number.isFinite) ? parts : defaultCenter();
        }
        return defaultCenter();
      }

      function defaultCenter() {
        if (SERVER_DEFAULT_CENTER.startsWith("__")) {
          return [0, 0];
        }
        const parts = SERVER_DEFAULT_CENTER.split(",").map((value) => Number(value.trim()));
        return parts.length === 2 && parts.every(Number.isFinite) ? parts : [0, 0];
      }

      function parseZoom() {
        const defaultZoom = SERVER_DEFAULT_ZOOM.startsWith("__")
          ? 2
          : Number(SERVER_DEFAULT_ZOOM);
        const zoom = Number(pageParams.get("zoom") ?? defaultZoom);
        return Number.isFinite(zoom) ? zoom : 2;
      }

      function appendRepeated(params, name, value, separator) {
        value
          .split(separator)
          .map((item) => item.trim())
          .filter(Boolean)
          .forEach((item) => params.append(name, item));
      }

      function tileParams() {
        const params = new URLSearchParams();
        params.set("mode", isMosaic() ? "mosaic" : "single");
        if (isMosaic()) {
          // Mosaic ignores ?dataset=; it uses the server's startup-loaded
          // MosaicJSON. Pixel-selection picks the reducer.
          params.set("pixel_selection", controls.pixelSelection.value);
        } else if (controls.dataset && controls.dataset.value) {
          params.set("dataset", controls.dataset.value);
        }
        appendRepeated(params, "bidx", controls.bidx.value, ",");
        // Stretch priority mirrors the server: custom rescale > stretch
        // mode > auto (no params → server default stddev 2σ).
        const mode = controls.stretch.value;
        const arg = controls.stretchArg.value.trim();
        if (mode === "custom") {
          appendRepeated(params, "rescale", controls.rescale.value, ";");
        } else if (mode === "minmax") {
          params.set("stretch", "minmax");
        } else if (mode === "percent") {
          params.set("stretch", "percent");
          if (arg) params.set("pc", arg);
        } else if (mode === "stddev") {
          params.set("stretch", "stddev");
          if (arg) params.set("sigma", arg);
        }
        // mode === "auto": send neither rescale nor stretch.
        if (controls.colormap.value) {
          params.set("colormap_name", controls.colormap.value);
        }
        params.set("resampling", controls.resampling.value);
        params.set("reproject", controls.resampling.value);
        params.set("tilesize", controls.tilesize.value || "256");
        return params;
      }

      // Bumped on every Apply. Appended only to the map's tile-source URL
      // (not the permalink) so a style change forces MapLibre AND the
      // browser HTTP cache to treat every zoom level's tiles as new —
      // otherwise cached overview/child tiles keep the previous style on
      // zoom. The server ignores unknown query keys, so `_v` is inert.
      let styleVersion = 0;

      function tileUrl() {
        const params = tileParams();
        params.set("_v", String(styleVersion));
        return `${tileOrigin()}${tilePath()}?${params.toString()}`;
      }

      function syncStatus() {
        controls.status.textContent = tileUrl();
      }

      function syncPermalink() {
        if (!(window.location.protocol === "http:" || window.location.protocol === "https:")) {
          return;
        }
        const params = tileParams();
        params.set("opacity", controls.opacity.value);
        const center = map.getCenter();
        params.set("center", `${center.lng.toFixed(5)},${center.lat.toFixed(5)}`);
        params.set("zoom", map.getZoom().toFixed(2));
        window.history.replaceState(null, "", `/maplibre?${params.toString()}`);
      }

      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            "osm-raster": {
              type: "raster",
              tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
              tileSize: 256,
              minzoom: 0,
              maxzoom: 19,
              attribution: '<a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            },
            "cog-raster": {
              type: "raster",
              tiles: [tileUrl()],
              tileSize: 256,
              minzoom: 0,
              maxzoom: 22,
              attribution: "async-geotiff"
            }
          },
          layers: [
            {
              id: "osm-raster",
              type: "raster",
              source: "osm-raster"
            },
            {
              id: "cog-raster",
              type: "raster",
              source: "cog-raster",
              paint: {
                "raster-opacity": Number(controls.opacity.value)
              }
            }
          ],
          id: "async-geotiff-maplibre"
        },
        center: parseCenter(),
        zoom: parseZoom()
      });

      map.addControl(new maplibregl.NavigationControl(), "top-right");
      map.addControl(new maplibregl.ScaleControl(), "bottom-right");

      document.getElementById("style-form").addEventListener("submit", (event) => {
        event.preventDefault();
        styleVersion += 1;
        // setTiles() only refreshes currently-visible tiles; MapLibre's
        // per-zoom tile pyramid keeps tiles fetched with the old URL, so
        // zooming reverts to the original style. Fully rebuild the source
        // and layer to invalidate the whole pyramid. Re-adding cog-raster
        // last keeps it above osm-raster.
        const opacity = Number(controls.opacity.value);
        if (map.getLayer("cog-raster")) {
          map.removeLayer("cog-raster");
        }
        if (map.getSource("cog-raster")) {
          map.removeSource("cog-raster");
        }
        map.addSource("cog-raster", {
          type: "raster",
          tiles: [tileUrl()],
          tileSize: 256,
          minzoom: 0,
          maxzoom: 22,
          attribution: "async-geotiff"
        });
        map.addLayer({
          id: "cog-raster",
          type: "raster",
          source: "cog-raster",
          paint: { "raster-opacity": opacity }
        });
        syncStatus();
        syncPermalink();
      });

      controls.opacity.addEventListener("input", () => {
        map.setPaintProperty("cog-raster", "raster-opacity", Number(controls.opacity.value));
      });

      // Populate the dataset switcher from the server's /datasets list.
      // Selecting one and rebuilding the source goes through the same
      // pyramid-invalidating path as Apply (so zoom keeps the dataset).
      (async function loadDatasets() {
        try {
          const resp = await fetch(`${tileOrigin()}/datasets`);
          if (!resp.ok) return;
          const names = await resp.json();
          if (!Array.isArray(names) || names.length === 0) return;
          const wanted = pageParams.get("dataset");
          controls.dataset.innerHTML = "";
          for (const name of names) {
            const opt = document.createElement("option");
            opt.value = name;
            opt.textContent = name;
            controls.dataset.appendChild(opt);
          }
          controls.dataset.value =
            wanted && names.includes(wanted) ? wanted : names[0];
          // Rebuild the COG source against the selected dataset, then
          // fly to its extent.
          document.getElementById("style-form").requestSubmit();
          flyToDataset();
        } catch (err) {
          console.warn("dataset list unavailable", err);
        }
      })();

      async function flyToDataset() {
        const ds = controls.dataset && controls.dataset.value;
        if (!ds) return;
        try {
          const r = await fetch(
            `${tileOrigin()}/bounds?dataset=${encodeURIComponent(ds)}`
          );
          if (!r.ok) return;
          const b = await r.json();
          if (Array.isArray(b) && b.length === 4 && b.every(Number.isFinite)) {
            map.fitBounds(
              [
                [b[0], b[1]],
                [b[2], b[3]]
              ],
              { padding: 40, duration: 800 }
            );
          }
        } catch (err) {
          console.warn("dataset bounds unavailable", err);
        }
      }

      controls.dataset.addEventListener("change", () => {
        document.getElementById("style-form").requestSubmit();
        flyToDataset();
      });

      // Reflect which companion arg the chosen stretch mode consumes,
      // and disable the rescale box unless in custom mode.
      function syncStretchUi() {
        const m = controls.stretch.value;
        const label = document.getElementById("stretchArgLabel");
        label.textContent = m === "percent" ? "pc (lo,hi)"
          : m === "stddev" ? "σ (k)" : "pc / σ";
        controls.stretchArg.disabled = !(m === "percent" || m === "stddev");
        controls.rescale.disabled = m !== "custom";
      }
      controls.stretch.addEventListener("change", () => {
        syncStretchUi();
        document.getElementById("style-form").requestSubmit();
      });
      syncStretchUi();

      controls.tilesize.addEventListener("change", () => {
        document.getElementById("style-form").requestSubmit();
      });

      map.on("moveend", syncPermalink);
      map.on("load", syncStatus);
      syncStatus();
    </script>
  </body>
</html>
