[package]
name = "async-geotiff"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Async COG → XYZ tile renderer (pure Rust, no GDAL)"

[dependencies]
async-tiff        = "0.3"
object_store      = { version = "0.11", features = ["http", "aws"] }
tile-grid         = "0.6"
proj              = { version = "0.27", optional = true }
raffine           = "0.2"
ndarray           = { version = "0.16", features = ["rayon"] }
fast_image_resize = { version = "5", features = ["rayon"] }
palette           = "0.7"
colorous          = "1"
enterpolation     = "0.3"
image             = { version = "0.25", default-features = false, features = ["png"] }
bytes             = "1"
bytemuck          = "1"
nom               = "7"
tokio             = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
rayon             = "1"
thiserror         = "1"
serde             = { version = "1", features = ["derive"] }
serde_urlencoded  = "0.7"
tracing           = "0.1"
axum              = { version = "0.7", optional = true }

[dev-dependencies]
tokio             = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }
criterion         = "0.5"
tempfile          = "3"
approx            = "0.5"

[features]
default = ["proj"]
proj    = ["dep:proj"]
server  = ["dep:axum"]
webp    = ["image/webp"]
jpeg    = ["image/jpeg"]

# [[bench]] section deferred to Task 24 when benches/tile_bench.rs is added
