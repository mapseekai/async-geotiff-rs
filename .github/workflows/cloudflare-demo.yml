name: Deploy Cloudflare demo container

on:
  push:
    branches: [main]
    paths:
      - src/**
      - examples/**
      - Cargo.toml
      - Cargo.lock
      - Dockerfile.demo
      - .dockerignore
      - wrangler.demo.jsonc
      - cloudflare-demo/**
      - .github/workflows/cloudflare-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-demo-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: bdebb92ffabb18388b7e2e864d63aee7

jobs:
  deploy:
    name: Deploy demo container
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-demo/package-lock.json

      - name: Install demo dependencies
        run: npm ci --prefix cloudflare-demo

      - name: Test demo project
        run: npm test --prefix cloudflare-demo

      - name: Type-check demo project
        run: npm run typecheck --prefix cloudflare-demo

      - name: Test Rust library
        run: cargo test --locked --lib --no-run

      - name: Deploy demo container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN GitHub Secret is required for deployment." >&2
            exit 1
          fi
          npx --prefix cloudflare-demo wrangler deploy --config wrangler.demo.jsonc
