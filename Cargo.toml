[package]
name = "async-geotiff"
version = "0.13.0"
publish = ["crates-io"]
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "Async COG → XYZ tile renderer (pure Rust, no GDAL)"
repository = "https://github.com/mapseekai/async-geotiff-rs"
homepage = "https://async-geotiff-rs.pages.dev/"
documentation = "https://docs.rs/async-geotiff"
readme = "README.md"
keywords = ["geotiff", "cog", "raster", "tiles", "async"]
categories = ["science::geo", "asynchronous", "multimedia::images"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/benches/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/README.zh-CN.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
]

[package.metadata.docs.rs]
no-default-features = true
features = ["mosaic", "stac", "webp", "jpeg", "perf-tracing"]

[dependencies]
raster-style     = "=0.4.0"
async-tiff        = "0.4.0"
async-trait       = "0.1"
object_store      = { version = "0.14", features = ["http", "aws"] }
tile-grid         = "0.6"
proj              = { version = "0.31", optional = true }
raffine           = "0.2"
ndarray           = { version = "0.17", features = ["rayon"] }
fast_image_resize = { version = "6", features = ["rayon"] }
colorous          = "1"
image             = { version = "0.25", default-features = false, features = ["png"] }
bytes             = "1"
bytemuck          = "1"
bitflags          = "2"
moka              = { version = "0.12", features = ["future", "sync"] }
tokio             = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
rayon             = "1"
thiserror         = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tracing           = "0.1"
console-subscriber = { version = "0.5", optional = true }
url               = "2"
reqwest           = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
quick-xml         = "0.39"
flate2           = "1.1"
zstd             = "0.13"
weezl            = "0.1"
jpeg-decoder     = { version = "0.3", default-features = false }
stac-client       = { version = "0.3", optional = true }
reqwest_stac      = { package = "reqwest", version = "0.11", default-features = false, optional = true }
futures = { version = "0.3.32", optional = true }
futures-util = "0.3"

[dev-dependencies]
tokio             = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util", "fs", "io-util"] }
criterion         = "0.8"
tempfile          = "3"
approx            = "0.5"
serde_json        = "1"
# HTTP layer lives only in examples/serve.rs, not the library core.
axum              = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
moka = { version = "0.12", features = ["future"] }

[features]
default = ["proj", "mosaic"]
proj    = ["dep:proj"]
webp    = ["image/webp"]
jpeg    = ["image/jpeg"]
mosaic  = ["dep:futures"]
stac    = ["mosaic", "dep:stac-client", "dep:reqwest_stac"]
perf-tracing = []
tokio-console = ["perf-tracing", "dep:console-subscriber", "tokio/tracing"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[test]]
name = "io_cog"
path = "tests/io/cog.rs"

[[test]]
name = "io_point"
path = "tests/io/point.rs"

[[test]]
name = "mosaic"
path = "tests/mosaic/mod.rs"
required-features = ["mosaic"]

[[test]]
name = "mosaic_mosaicjson"
path = "tests/mosaic/mosaicjson.rs"
required-features = ["mosaic"]

[[test]]
name = "render_pipeline"
path = "tests/render/pipeline.rs"

[[test]]
name = "style_params"
path = "tests/style/params.rs"

[[test]]
name = "style_statistics"
path = "tests/style/statistics.rs"

[[test]]
name = "tiler"
path = "tests/tiler.rs"

[[example]]
name = "serve"
required-features = ["mosaic"]

[[example]]
name = "mosaic_source"
required-features = ["mosaic"]

[[example]]
name = "mosaic_json"
required-features = ["mosaic"]

[[bench]]
name = "resampler_bench"
harness = false
